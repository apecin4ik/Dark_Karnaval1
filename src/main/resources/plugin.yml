name: DarkCarnival
version: 1.0.0
main: me.darkcarnival.DarkCarnival
api-version: "1.16"
softdepend: [PlayerPoints, WorldGuard, WorldEdit, FastAsyncWorldEdit, GriefPrevention]
description: Ивент «Дарк Карнавал» — обсидиановая шахта с тыквами и награды за топ-3
commands:
  event:
    description: Информация об ивенте Дарк Карнавал
    usage: /event [top|start|stop|reload]
    aliases: [darkcarnival]
permissions:
  darkcarnival.use:
    description: Смотреть информацию об ивенте
    default: true
  darkcarnival.admin:
    description: Запускать, останавливать и перезагружать ивент
    default: op
